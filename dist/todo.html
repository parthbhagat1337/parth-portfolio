<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Entrepreneur Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --surface: rgba(30, 41, 59, 0.8);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --accent: #38bdf8;
            --danger: #ef4444;
            --terminal-bg: #000000;
            --terminal-text: #22c55e;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            padding: 1.5rem 2rem;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            backdrop-filter: blur(10px);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            flex-grow: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Panels */
        .panel {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: var(--accent);
            border-bottom: 1px solid var(--surface-border);
            padding-bottom: 0.5rem;
        }

        /* Controls & Inputs */
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--accent);
            color: #fff;
        }

        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        .editor {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 1rem;
            min-height: 80px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 1rem;
            transition: height 0.2s;
        }

        .editor:focus {
            border-color: var(--accent);
        }

        /* Todo List */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            overflow-y: auto;
            max-height: 50vh;
        }

        .todo-item {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
        }

        .todo-item input[type="checkbox"] {
            margin-top: 0.3rem;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .todo-content {
            flex-grow: 1;
            outline: none;
        }

        .todo-item.checked .todo-content {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        /* Notes Grid */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            overflow-y: auto;
            max-height: 50vh;
        }

        .note-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 8px;
            position: relative;
        }

        .note-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            outline: none;
            color: var(--accent);
        }

        .note-body {
            outline: none;
            min-height: 50px;
        }

        .delete-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
        }

        /* Terminal Logs */
        .terminal {
            background: var(--terminal-bg);
            border-top: 2px solid #333;
            height: 200px;
            padding: 1rem 2rem;
            font-family: 'Courier New', Courier, monospace;
            color: var(--terminal-text);
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .terminal-header {
            color: #fff;
            margin-bottom: 0.5rem;
            border-bottom: 1px dashed var(--terminal-text);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .terminal {
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <header>Global Workspace</header>

    <div class="container">
        <div class="panel">
            <h2>Active Tasks</h2>
            
            <div class="controls">
                <button onclick="formatText('insertUnorderedList')">Bullet List</button>
                <button onclick="formatText('insertOrderedList')">Numbered List</button>
            </div>
            
            <div id="todoInput" class="editor" contenteditable="true" data-placeholder="Type your task here... (Supports paste formatting)"></div>
            <button onclick="addTodo()" style="margin-bottom: 1.5rem; width: 100%;">+ Add Task</button>

            <div id="todoList" class="todo-list">
                </div>
        </div>

        <div class="panel">
            <h2>Quick Notes</h2>
            <button onclick="addNote()" style="margin-bottom: 1.5rem;">+ Create New Note</button>
            <div id="notesGrid" class="notes-grid">
                </div>
        </div>
    </div>

    <div class="terminal" id="terminalLog">
        <div class="terminal-header">
            <span>SYSTEM LOGS - READ ONLY</span>
            <span>NO MODIFICATION PERMITTED</span>
        </div>
        <div id="logContent"></div>
    </div>

    <script>
        // --- State Management ---
        let todos = JSON.parse(localStorage.getItem('ent_todos')) || [];
        let notes = JSON.parse(localStorage.getItem('ent_notes')) || [];
        let logs = JSON.parse(localStorage.getItem('ent_logs')) || [];
        
        // Network / Device Data
        let userIP = "Fetching...";
        const deviceName = navigator.platform + " / " + navigator.userAgent.split(' ')[0];

        // --- Initialization ---
        async function init() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                userIP = data.ip;
            } catch (error) {
                userIP = "Unknown IP";
            }
            
            if(logs.length === 0) logAction("System initialized. Session started.");
            
            renderTodos();
            renderNotes();
            renderLogs();
        }

        // --- Rich Text Formatting ---
        function formatText(command) {
            document.execCommand(command, false, null);
            document.getElementById('todoInput').focus();
        }

        // --- Logging System ---
        function logAction(actionDescription) {
            const now = new Date();
            const timeString = now.toLocaleString();
            const logEntry = `[${timeString}] IP: ${userIP} | Device: ${deviceName} | ACTION: ${actionDescription}`;
            
            logs.push(logEntry);
            localStorage.setItem('ent_logs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const logDiv = document.getElementById('logContent');
            logDiv.innerHTML = logs.map(log => `<div>> ${log}</div>`).join('');
            const terminal = document.getElementById('terminalLog');
            terminal.scrollTop = terminal.scrollHeight; // Auto-scroll to bottom
        }

        // --- Todo System ---
        function addTodo() {
            const inputDiv = document.getElementById('todoInput');
            const content = inputDiv.innerHTML.trim();
            
            if (content === '') return;

            const newTodo = { id: Date.now(), content: content, checked: false };
            todos.push(newTodo);
            saveTodos();
            
            inputDiv.innerHTML = ''; // Clear input
            logAction("Added new task.");
            renderTodos();
        }

        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.checked = !todo.checked;
                saveTodos();
                logAction(`Marked task as ${todo.checked ? 'completed' : 'pending'}.`);
                renderTodos();
            }
        }

        function updateTodoContent(id, newContent) {
            const todo = todos.find(t => t.id === id);
            if (todo && todo.content !== newContent) {
                todo.content = newContent;
                saveTodos();
                logAction("Modified existing task content.");
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(t => t.id !== id);
            saveTodos();
            logAction("Deleted a task.");
            renderTodos();
        }

        function saveTodos() {
            localStorage.setItem('ent_todos', JSON.stringify(todos));
        }

        function renderTodos() {
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            todos.forEach(todo => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `todo-item ${todo.checked ? 'checked' : ''}`;
                
                itemDiv.innerHTML = `
                    <input type="checkbox" ${todo.checked ? 'checked' : ''} onchange="toggleTodo(${todo.id})">
                    <div class="todo-content" contenteditable="true" onblur="updateTodoContent(${todo.id}, this.innerHTML)">
                        ${todo.content}
                    </div>
                    <button class="btn-danger" onclick="deleteTodo(${todo.id})">X</button>
                `;
                list.appendChild(itemDiv);
            });
        }

        // --- Notes System ---
        function addNote() {
            const newNote = {
                id: Date.now(),
                title: "New Note",
                content: "Start typing here..."
            };
            notes.unshift(newNote); // Add to top
            saveNotes();
            logAction("Created a new note.");
            renderNotes();
        }

        function updateNote(id, field, newValue) {
            const note = notes.find(n => n.id === id);
            if (note && note[field] !== newValue) {
                note[field] = newValue;
                saveNotes();
                logAction(`Modified note ${field}.`);
            }
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveNotes();
            logAction("Deleted a note.");
            renderNotes();
        }

        function saveNotes() {
            localStorage.setItem('ent_notes', JSON.stringify(notes));
        }

        function renderNotes() {
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';
            
            notes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                
                noteCard.innerHTML = `
                    <button class="btn-danger delete-btn" onclick="deleteNote(${note.id})">X</button>
                    <div class="note-title" contenteditable="true" onblur="updateNote(${note.id}, 'title', this.innerText)">
                        ${note.title}
                    </div>
                    <div class="note-body" contenteditable="true" onblur="updateNote(${note.id}, 'content', this.innerHTML)">
                        ${note.content}
                    </div>
                `;
                grid.appendChild(noteCard);
            });
        }

        // Boot Application
        init();
    </script>
</body>
</html>
